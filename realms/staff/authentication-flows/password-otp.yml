alias: username und otp
description: Login mit Username und Passwort sowie OTP oder Recovery Code, alternativ mit Passkey wenn Passkeys aktiviert sind
steps:
  - auth: auth-cookie
    requirement: ALTERNATIVE
  - auth: identity-provider-redirector
    requirement: ALTERNATIVE
  - alias: upo_login
    description: Login mit Username und Passwort sowie OTP oder Recovery Code, alternativ mit Passkey wenn Passkeys aktiviert sind
    requirement: ALTERNATIVE
    steps:
      # Bietet bei aktivierten Passkeys (KEYCLOAK_PASSKEYS_ENABLED) zusätzlich die Anmeldung per Passkey an
      - auth: auth-username-password-form
        requirement: REQUIRED
      # Bedingungen wirken nur in CONDITIONAL-Sub-Flows
      - alias: upo_second_factor
        description: Zweiter Faktor, entfällt nach einer Anmeldung per Passkey
        requirement: CONDITIONAL
        steps:
          # included ist standardmäßig false: die Bedingung greift, wenn kein Passkey verwendet wurde
          - auth: conditional-credential
            authenticatorConfig:
              alias: passkey-not-used
              credentials: webauthn-passwordless
            requirement: REQUIRED
          - alias: opo_otp_recovery
            description: Eingabe von OTP oder Recovery Code
            requirement: REQUIRED
            steps:
              # Das OTP-Formular ist REQUIRED, damit Nutzer:innen ohne OTP dieses beim Login einrichten müssen
              - alias: upo_otp
                description: Eingabe des OTP
                requirement: ALTERNATIVE
                steps:
                  - auth: auth-otp-form
                    requirement: REQUIRED
              - alias: upo_recovery
                description: Eingabe eines Recovery Codes
                requirement: ALTERNATIVE
                steps:
                  - auth: auth-recovery-authn-code-form
                    requirement: REQUIRED
